# relay/deploy/ntfy/nginx-push.conf — push.sigelo.ai: ntfy (UnifiedPush) on 127.0.0.1:2586, behind nginx on the relay's
# host. Installed as /etc/nginx/conf.d/sigelo-push.conf (README.md), inside the distribution's http {} block, beside
# sigelo-relay.conf (relay/deploy/nginx.conf), whose default servers drop any other name.
# SPDX-License-Identifier: AGPL-3.0-only
#
# No access log: the path of a request is a phone's topic (its capability). The error log at crit, as the relay's.
# A request body at most 8 KiB (a wake is 135 bytes; ntfy's own limit is 4k). The subscriptions are long-lived
# (JSON stream, WebSocket): no buffering, an upgrade passed on, 3 minutes of silence allowed (ntfy sends keepalives).

map $http_upgrade $sigelo_push_connection {
    default upgrade;
    "" "";
}

server {
    listen 80;
    listen [::]:80;
    server_name push.sigelo.ai;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/sigelo/error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://push.sigelo.ai$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name push.sigelo.ai;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/sigelo/error.log crit;
    ssl_certificate /etc/letsencrypt/live/push.sigelo.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.sigelo.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    client_max_body_size 8k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $sigelo_push_connection;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3m;
    proxy_send_timeout 3m;

    location / {
        proxy_pass http://127.0.0.1:2586;
    }
}
