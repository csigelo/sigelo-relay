# relay/deploy/turnserver.conf — coturn on the relay host as a STUN server only (design/transfer.md §2):
# an agent starting a direct transfer asks it once which public address and port its request came
# from. No file byte passes it. Installed by hand as /etc/turnserver.conf (README.md "STUN").
# TURN (Pro, metered) is a later step: then use-auth-secret, static-auth-secret, no-tcp-relay and the
# denied-peer-ip ranges go here, and stun-only goes.

listening-port=3478
# UDP only: no TCP, no TLS, no DTLS listener (STUN needs none, and each is more parsing).
no-tcp
no-tls
no-dtls
stun-only
no-cli
fingerprint
no-software-attribute
no-multicast-peers
# No record of who asked: the addresses a STUN reply carries are not logged.
log-file=/dev/null
no-stdout-log
