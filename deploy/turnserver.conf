# SPDX-License-Identifier: AGPL-3.0-only
# relay/deploy/turnserver.conf — coturn on the relay host: STUN for every direct call and transfer,
# and TURN, a relayed path for those that find no direct one.
# Media and file bytes stay end to end (DTLS-SRTP, DTLS): coturn moves ciphertext.
# Installed by hand as /etc/turnserver.conf, 0640 root:turnserver, with two lines added on the host
# (README.md "STUN and TURN"): static-auth-secret=<the contents of /etc/sigelo-turn.secret>, never
# in this file, and nothing else. The relay hands out credentials for it to logged-in identities
# (turn.mjs); nobody else can allocate.

listening-port=3478
# UDP and TCP on 3478 (TCP for networks that let no UDP out). No TLS, no DTLS listener yet:
# turns: on 443 is a later step.
no-tls
no-dtls
no-cli
fingerprint
no-software-attribute
realm=relay.sigelo.ai

# Credentials: coturn's TURN REST scheme. username "<expiry, unix seconds>:<tag>", password
# base64(HMAC-SHA1(secret, username)); an expired username is refused at allocation. An allocation
# made before the expiry is refreshed after it (coturn 4.6.1, measured): a long call is not cut.
use-auth-secret
# A nonce lives 10 minutes.
stale-nonce=600

# Relayed addresses: UDP ports 49160-49400 only (241 allocations at most, the firewall opens the same
# range). Relay endpoints are UDP only (RFC 5766): no TCP relay (RFC 6062), which WebRTC never asks.
min-port=49160
max-port=49400
no-tcp-relay

# Caps. An allocation is one side of one call or transfer attempt.
#   user-quota: allocations at once per username, i.e. per identity per hour (turn.mjs);
#   total-quota: allocations at once on the host (below the port range's 241);
#   max-bps: bytes a second per allocation, each direction: 500 kB/s = 4 Mbit/s. A voice call needs
#     about 7 kB/s (55 kbit/s with headers), a relayed transfer gets up to the cap;
#   bps-capacity: all allocations together, each direction: 25 MB/s = 200 Mbit/s.
user-quota=8
total-quota=200
max-bps=500000
bps-capacity=25000000
max-allocate-lifetime=3600

# Peers: no multicast, no loopback (coturn's default), no private, shared, link-local, documentation
# or reserved range: nothing reachable from the host that is not reachable from the Internet.
# The host's own public addresses stay allowed: two sides each relayed by this host talk
# relay to relay through them, and only coturn listens there for UDP.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
# Not ::/112 nor ::ffff:0:0/96: coturn 4.6.1 matches IPv4 peers against those, and every IPv4 peer was refused.
# So an IPv6 allocation is granted a permission to ::ffff:10.0.0.1 or ::ffff:127.0.0.1, but nothing is sent there
# (measured: no packet on any interface, none reached a listener on 127.0.0.1 or this host's address).
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# No record of who asked or who relayed: neither addresses nor usernames are logged.
log-file=/dev/null
no-stdout-log
