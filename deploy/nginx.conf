# relay/deploy/nginx.conf — sigelo.ai, www.sigelo.ai and relay.sigelo.ai on the relay's host.
# SPDX-License-Identifier: AGPL-3.0-only
#
# Installed inside the distribution's http {} block as /etc/nginx/conf.d/sigelo-relay.conf (Debian)
# by sigelo-relay-apply with each release, after `nginx -t` (relay/deploy/README.md "nginx" also says
# how by hand). Written to the nginx documentation and checked by
# relay/site/test.mjs and relay/site/build.mjs --final; NOT run through `nginx -t` where it was
# written. Needs nginx >= 1.19.4 (ssl_reject_handshake); HTTP/2 is switched on in the
# `listen` lines, the form nginx 1.22 knows.
#
# House style of site/deploy/nginx.conf (sigelo.io): one statement per line, comments on their own
# lines, no include, no alias, fixed paths. Two directives that file does not use: proxy_set_header
# (the relay counts the client's address, cut to /24 or /48, from X-Real-IP, believed from loopback
# only) and error_page (the not-found page).
#
#   sigelo.ai        the site, /var/www/sigelo.ai/dist (relay/site/dist, built --final; a link to
#                    the release's site/dist)
#   www.sigelo.ai    301 to https://sigelo.ai, path kept; http:// the same
#   relay.sigelo.ai  the front page, /relay.json, /llms.txt, its own /robots.txt, and /challenge,
#                    /check, /park, /park/<hash>, /licence and /stats proxied to the relay on 127.0.0.1:8791
#                    (RELAY_HTTP_PORT); any other path 301 to https://sigelo.ai, path kept. MQTT
#                    (8883) is the relay's own listener, not proxied.
#   sigelo.ai/_stats/  the visit statistics (site/deploy/server-setup.sh --relay, R16): GoAccess and
#                    the relay's chart, behind basic auth, not logged, noindex, no-store.
#
# Privacy (relay/site/privacy.md): the access log of sigelo.ai and relay.sigelo.ai over TLS, for
# visit counts, holds no full address and no query string: log_format sigelo_anon, sigelo.io's
# (site/deploy/nginx.conf), field for field: the address cut to its network ($sigelo_net: IPv4
# /24, IPv6 /48), the time, method, path without its query ($sigelo_path: /challenge?did=… is
# logged as /challenge), status, size, the referrer cut to scheme and host ($sigelo_ref), the
# user agent and Accept (what tells an agent from a browser), the request time. sigelo.ai goes to
# access.log, relay.sigelo.ai to relay-access.log, the project's own requests (user agent
# sigelo-selfcheck/) to access-self.log; logrotate keeps 7 days (server-setup.sh --relay, R8).
# Port 80, www, the default servers, /_stats/ and /park/<hash> keep none (that path is a short
# invite code's hash: 40 bits, which a log reader could search while the code is good; relay/park.mjs).
# The error log is at crit, because nginx writes the full client address into every error-level
# line (each limit_req refusal among them); a crit line may still hold one (a failed TLS handshake), so it is kept 7 days too.
# relay/site/build.mjs --final refuses a server block that logs in another format or below crit,
# a log format or map that keeps more, a /_stats/ without basic auth, a proxy without X-Real-IP at
# its own level, or proxy_set_header in a location.
#
# Headers: every one at server level and none in a location, because one add_header inside a
# location silently drops all the inherited ones. HSTS for a year, without includeSubDomains or
# preload (those bind every future subdomain: the Owner's decision). Every response of sigelo.ai
# and relay.sigelo.ai over TLS names /llms.txt as describedby (RFC 8288); the redirects of www and
# port 80 do not. index.json, relay.json and llms.txt are open to any origin (CORS), so a
# browser-based agent can read them. Cache-Control from maps: an hour, a minute for a miss,
# nothing for the relay's HTTP calls.
#
# Browsers: /challenge, /check, /park, /park/<hash> and /licence refuse (403) a request a browser
# makes, marked by Sec-Fetch-Site or Origin; the relay's clients (Node's fetch, curl) send neither
# ($sigelo_browser).

# ---- maps (http context) -------------------------------------------------------------------------
map $http_accept $sigelo_md {
    default 0;
    "~*text/markdown" 1;
}

map $status $sigelo_cache {
    default "public, max-age=60";
    200 "public, max-age=3600";
    301 "public, max-age=3600";
    304 "public, max-age=3600";
}

# Keyed on $uri after try_files or error_page picked the file: a page names its Markdown twin, a
# twin its page as canonical (Google reads rel=canonical in a Link header for non-HTML files); the
# not-found page neither. Exact strings win over the regular expressions.
map $uri $sigelo_link {
    default "";
    "/404.html" "";
    "/404.md" "";
    "/index.html" '</index.md>; rel="alternate"; type="text/markdown"';
    "/index.md" '<https://sigelo.ai/>; rel="canonical"';
    "~^/(?<sigelo_lh>[\w-]+)\.html$" '</$sigelo_lh.md>; rel="alternate"; type="text/markdown"';
    "~^/(?<sigelo_lm>[\w-]+)\.md$" '<https://sigelo.ai/$sigelo_lm.html>; rel="canonical"';
}

map $uri $sigelo_robots {
    default "";
    "/404.html" "noindex";
    "/404.md" "noindex";
    "/challenge" "noindex";
    "/check" "noindex";
    "/park" "noindex";
    "~^/park/" "noindex";
    "/licence" "noindex";
    "/stats" "noindex";
}

map $uri $sigelo_cors {
    default "";
    "/index.json" "*";
    "/relay.json" "*";
    "/llms.txt" "*";
    "/stats" "*";
}

# "stats:" when the statistics' root served the request (location ^~ /_stats/), else "". The
# site's headers key on it first: its rewrite sets $uri to the file it serves (/index.html), which
# is not the site's front page. The report runs its own inline script and styles and loads
# nothing; it is never cached or indexed and names no Markdown twin.
map $document_root $sigelo_stats {
    default "";
    "/var/www/sigelo.ai/stats" "stats:";
}

map $sigelo_stats $sigelo_csp {
    default "default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    "stats:" "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
}

map $sigelo_stats $sigelo_site_cache {
    default $sigelo_cache;
    "stats:" "no-store";
}

map $sigelo_stats $sigelo_site_robots {
    default $sigelo_robots;
    "stats:" "noindex, nofollow, noarchive";
}

map $sigelo_stats $sigelo_site_link {
    default $sigelo_link;
    "stats:" "";
}

# relay.sigelo.ai: its HTTP calls are never cached and point at the docs (RFC 8631); /stats (counts
# only, relay/stats.mjs, which computes it at most once a minute) is cached a minute.
map $uri $relay_cache {
    default $sigelo_cache;
    "/challenge" "no-store";
    "/check" "no-store";
    "/park" "no-store";
    "~^/park/" "no-store";
    "/licence" "no-store";
    "/stats" "public, max-age=60";
}

map $uri $relay_link {
    default "";
    "/challenge" '<https://sigelo.ai/index.json>; rel="service-desc"; type="application/json", <https://sigelo.ai/>; rel="service-doc"';
    "/check" '<https://sigelo.ai/index.json>; rel="service-desc"; type="application/json", <https://sigelo.ai/>; rel="service-doc"';
    "/park" '<https://sigelo.ai/index.json>; rel="service-desc"; type="application/json", <https://sigelo.ai/>; rel="service-doc"';
    "~^/park/" '<https://sigelo.ai/index.json>; rel="service-desc"; type="application/json", <https://sigelo.ai/>; rel="service-doc"';
    "/licence" '<https://sigelo.ai/index.json>; rel="service-desc"; type="application/json", <https://sigelo.ai/>; rel="service-doc"';
}

# The client address cut to its network, IPv4 /24 and IPv6 /48 (as site/deploy/nginx.conf): nginx's
# rate limit counts per network, as the relay's own does, and never keeps a full address.
map $remote_addr $sigelo_net {
    default "0.0.0.0";
    "~^(?<sigelo_n4>\d+\.\d+\.\d+)\.\d+$" "$sigelo_n4.0";
    "~*^(?<sigelo_n6>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):" "$sigelo_n6::";
    "~*^(?<sigelo_n6b>[0-9a-f]+:[0-9a-f]+)::" "$sigelo_n6b::";
    "~*^(?<sigelo_n6c>[0-9a-f]+)::" "$sigelo_n6c::";
}

# The referrer cut to scheme and host; the path without its query string (GET /challenge?did=… is
# logged as /challenge). site/deploy/nginx.conf's, unchanged.
map $http_referer $sigelo_ref {
    default "-";
    "~*^(?<sigelo_rs>https?)://(?<sigelo_rh>[^/:?#]+)" "$sigelo_rs://$sigelo_rh/";
}

map $request_uri $sigelo_path {
    default "-";
    "~^(?<sigelo_p>/[^?]*)" "$sigelo_p";
}

# The project's own requests (deploy/check.mjs, the selfcheck, the phone's watchdog) send the user
# agent sigelo-selfcheck/1: they go to access-self.log, so the statistics count outsiders only.
# `access_log … if=` logs when the value is neither "" nor "0".
map $http_user_agent $sigelo_self {
    default 0;
    "~^sigelo-selfcheck/" 1;
}

map $http_user_agent $sigelo_outside {
    default 1;
    "~^sigelo-selfcheck/" 0;
}

# sigelo.io's format (GoAccess reads it as  %h %^ %^ [%d:%t %^] "%m %U %H" %s %b "%R" "%u" "%^" %T).
# sigelo-relay-apply allows this one format string and no other.
log_format sigelo_anon '$sigelo_net - - [$time_local] "$request_method $sigelo_path $server_protocol" $status $body_bytes_sent "$sigelo_ref" "$http_user_agent" "$http_accept" $request_time';

# 1 for a request a browser made, for another site's page or for this one: browsers send
# Sec-Fetch-Site (cross-site, same-site, same-origin) and, on a POST or a cross-origin fetch, Origin.
# The relay charges its per-network login and challenge budgets before it reads a body, so without
# this any web page (an ad, an <img> in a forum post) could make its visitors' browsers spend them
# and lock every agent on their /24 or /48 out. No page uses these calls: they send no CORS header.
# The relay's clients (Node's fetch, curl) send neither header, and a URL typed into the address
# bar sends "none". A browser that sends neither (Safari before 16.4, on a GET) still passes.
map $http_sec_fetch_site$http_origin $sigelo_browser {
    default 1;
    "" 0;
    none 0;
}

# A first brake in front of the relay's own (RELAY_LOGIN_RATE, per /24 or /48 a minute).
limit_req_zone $sigelo_net zone=sigelo_relay:10m rate=5r/s;

# ---- anything that is not ours: dropped, unlogged ------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/sigelo/error.log crit;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/sigelo/error.log crit;
    ssl_reject_handshake on;
    # The protocol is negotiated before SNI picks a server, so the default server's list counts.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # A handshake with our name's SNI but a request for another Host (or none) ends here too:
    # dropped, not served nginx's own page under sigelo.ai's certificate.
    return 444;
}

# ---- port 80: ACME challenges, everything else to https ------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sigelo.ai www.sigelo.ai;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/sigelo/error.log crit;

    # certbot renew --webroot -w /var/www/acme (README "Certificate").
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://sigelo.ai$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.sigelo.ai;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/sigelo/error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://relay.sigelo.ai$request_uri;
    }
}

# ---- www.sigelo.ai over TLS: 301 to the apex -----------------------------------------------------
# One certificate lineage, /etc/letsencrypt/live/sigelo.ai, carries all three names.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sigelo.ai;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/sigelo/error.log crit;

    ssl_certificate /etc/letsencrypt/live/sigelo.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigelo.ai/privkey.pem;
    # Mozilla "intermediate": TLS 1.2 and 1.3, AEAD ciphers with forward secrecy only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:sigelo_tls:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $sigelo_cache always;
    return 301 https://sigelo.ai$request_uri;
}

# ---- sigelo.ai: the site -------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sigelo.ai;
    server_tokens off;
    root /var/www/sigelo.ai/dist;
    index index.html;
    access_log /var/log/nginx/sigelo/access.log sigelo_anon if=$sigelo_outside;
    access_log /var/log/nginx/sigelo/access-self.log sigelo_anon if=$sigelo_self;
    error_log /var/log/nginx/sigelo/error.log crit;
    log_not_found off;

    ssl_certificate /etc/letsencrypt/live/sigelo.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigelo.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:sigelo_tls:10m;
    ssl_session_tickets off;

    # Exactly the extensions relay/site/dist holds; anything else is application/octet-stream.
    types {
        text/html html;
        text/markdown md;
        text/plain txt;
        text/css css;
        application/json json;
        application/xml xml;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/html text/markdown text/plain text/css;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/markdown text/plain text/css application/json application/xml;

    # No script runs anywhere on the site, so default-src 'self' costs nothing; the JSON-LD blocks
    # are data, not script. /_stats/ (behind auth) gets its own ($sigelo_stats above).
    add_header Content-Security-Policy $sigelo_csp always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Vary "Accept" always;
    add_header Cache-Control $sigelo_site_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag $sigelo_site_robots always;
    add_header Access-Control-Allow-Origin $sigelo_cors always;
    add_header Link $sigelo_site_link always;
    add_header Link '</llms.txt>; rel="describedby"; type="text/plain"' always;

    error_page 404 /404.html;

    # Dotfiles are not served; /.well-known/ is (security.txt).
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # relay.sigelo.ai's robots.txt lives in the same dist; here it is no page.
    location = /relay-robots.txt {
        return 404;
    }

    # The not-found page answers 404, also when asked for by name (error_page still reaches it).
    location = /404 {
        return 404;
    }

    location = /404.html {
        internal;
    }

    # The pay page that was (until 2026-10-14): Pro and how to pay are on /pro and /contact now.
    location = /pay-monero.html {
        return 301 https://sigelo.ai/pro.html;
    }

    location = /pay-monero.md {
        return 301 https://sigelo.ai/pro.md;
    }

    location = /pay-monero {
        return 301 https://sigelo.ai/pro.html;
    }

    # The visit statistics (site/deploy/server-setup.sh --relay, R16, regenerates them every 10
    # minutes into /var/www/sigelo.ai/stats): basic auth, not logged; no-store, noindex (the maps).
    location = /_stats {
        return 301 https://sigelo.ai/_stats/;
    }

    location ^~ /_stats/ {
        access_log off;
        auth_basic "sigelo.ai stats";
        auth_basic_user_file /etc/nginx/sigelo-stats.htpasswd;
        root /var/www/sigelo.ai/stats;
        rewrite ^/_stats/$ /index.html break;
        rewrite ^/_stats/(.+)$ /$1 break;
        try_files $uri =404;
    }

    # Markdown negotiation: Accept: text/markdown on /, /<page>.html or /<page> serves the twin.
    location = / {
        if ($sigelo_md) {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
    }

    location ~ ^/[\w-]+\.html$ {
        if ($sigelo_md) {
            rewrite ^/([\w-]+)\.html$ /$1.md last;
        }
        try_files $uri =404;
    }

    location ~ ^/[\w-]+$ {
        if ($sigelo_md) {
            rewrite ^/([\w-]+)$ /$1.md last;
        }
        try_files $uri.html =404;
    }

    location / {
        try_files $uri =404;
    }
}

# ---- relay.sigelo.ai: the relay's HTTP calls, its info, and the front page -----------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relay.sigelo.ai;
    server_tokens off;
    root /var/www/sigelo.ai/dist;
    access_log /var/log/nginx/sigelo/relay-access.log sigelo_anon if=$sigelo_outside;
    access_log /var/log/nginx/sigelo/access-self.log sigelo_anon if=$sigelo_self;
    error_log /var/log/nginx/sigelo/error.log crit;
    log_not_found off;

    ssl_certificate /etc/letsencrypt/live/sigelo.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigelo.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:sigelo_tls:10m;
    ssl_session_tickets off;

    types {
        text/html html;
        text/markdown md;
        text/plain txt;
        text/css css;
        application/json json;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/html text/markdown text/plain text/css;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Vary "Accept" always;
    add_header Cache-Control $relay_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag $sigelo_robots always;
    add_header Access-Control-Allow-Origin $sigelo_cors always;
    add_header Link $relay_link always;
    add_header Link '</llms.txt>; rel="describedby"; type="text/plain"' always;

    # The relay believes X-Real-IP from loopback only, counts it and logs it cut to /24 or /48.
    # Without it every client is one address and the relay soon refuses everyone. Set here and in no
    # location: a location with any proxy_set_header of its own drops this one, and nginx then
    # passes the client's own X-Real-IP through.
    proxy_set_header X-Real-IP $remote_addr;
    limit_req_status 429;

    # The front page, here too: an agent that knows only this host from an invite code reads it
    # without following a redirect to another host. Its canonical is https://sigelo.ai/.
    location = / {
        if ($sigelo_md) {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
    }

    location = /index.md {
        try_files $uri =404;
    }

    location = /style.css {
        try_files $uri =404;
    }

    # The relay info document (design/relay-plan.md §11) and llms.txt.
    location = /relay.json {
        try_files $uri =404;
    }

    location = /llms.txt {
        try_files $uri =404;
    }

    location = /robots.txt {
        try_files /relay-robots.txt =404;
    }

    location = /challenge {
        if ($sigelo_browser) {
            return 403;
        }
        limit_req zone=sigelo_relay burst=20 nodelay;
        proxy_pass http://127.0.0.1:8791;
    }

    # auth.mjs MAX_BODY is 256 KB.
    location = /check {
        if ($sigelo_browser) {
            return 403;
        }
        limit_req zone=sigelo_relay burst=20 nodelay;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8791;
    }

    # Short invite codes (relay/park.mjs): the inviter parks (a login's fields, so the size of
    # /check's), the accepter fetches once by hash. The relay brakes both per network.
    location = /park {
        if ($sigelo_browser) {
            return 403;
        }
        limit_req zone=sigelo_relay burst=20 nodelay;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8791;
    }

    location ^~ /park/ {
        access_log off;
        if ($sigelo_browser) {
            return 403;
        }
        limit_req zone=sigelo_relay burst=20 nodelay;
        proxy_pass http://127.0.0.1:8791;
    }

    location = /licence {
        if ($sigelo_browser) {
            return 403;
        }
        limit_req zone=sigelo_relay burst=5 nodelay;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8791;
    }

    # The relay's counts (relay/stats.mjs): no identifier, open to any origin, cached a minute
    # (the maps above). No browser refusal: it charges no budget, and any page may chart it.
    location = /stats {
        limit_req zone=sigelo_relay burst=20 nodelay;
        proxy_pass http://127.0.0.1:8791;
    }

    location / {
        return 301 https://sigelo.ai$request_uri;
    }
}
